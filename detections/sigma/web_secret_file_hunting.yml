title: Web Requests Hunting For Secret And Repository Files
id: b47a1e90-2d5c-4c8f-9e36-1a0f7d3c5b28
status: experimental
description: |
  Detects requests for files that should never be served: environment files,
  Git metadata, cloud credentials and SSH keys. A 200 response to any of them
  is an incident; a 404 is background scanning.
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://github.com/jorgearma/siege-map
author: Jorge Escobar (siege-map)
date: 2026-11-15
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.reconnaissance
  - attack.t1595.003
logsource:
  category: webserver
detection:
  selection:
    cs-uri-stem|contains:
      - '/.env'
      - '/.git/config'
      - '/.git/HEAD'
      - '/.aws/credentials'
      - '/.ssh/id_rsa'
      - '/wp-config.php.bak'
  filter_wellknown:
    cs-uri-stem|startswith: '/.well-known/'
  condition: selection and not filter_wellknown
falsepositives:
  - Authorised vulnerability scans
level: low
