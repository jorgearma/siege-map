services:
  backend:
    build: ./backend
    container_name: ssh-rain-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Same time zone as the host: classic syslog lines ("Apr 13 19:18:25")
      # carry no offset, so the container must read them with the host's clock
      - TZ=${TZ:-UTC}
    # Hardening: non-root user (Dockerfile) + only what it needs to read logs
    user: "10001"
    group_add:
      - "${LOG_GID:-4}"   # host "adm" group → read auth.log (root/syslog:adm 640) without root
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    # CPU: sin límite, un bucle o un pico de ataques se come la CPU de todo el VPS (OWASP #7)
    cpus: "1.0"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Mount the host SSH log file (read-only)
      - ${SSH_LOG_PATH:-/var/log/auth.log}:${SSH_LOG_PATH:-/var/log/auth.log}:ro
      # Mount the nginx log directory (so tail -F survives logrotate).
      # Behind a Cloudflare Tunnel with a containerised site, point NGINX_LOG_DIR
      # to the host folder where that container writes its access.log.
      - ${NGINX_LOG_DIR:-/var/log/nginx}:/var/log/nginx:ro
      # SQLite: the only writable path (the root filesystem stays read-only).
      # Holds daily aggregates forever and EVENT_RETENTION_DAYS of events.
      - siege-data:/data
      # Optional local GeoIP databases (GEO_PROVIDER=mmdb, scripts/fetch_geoip.sh)
      - ${GEOIP_DIR:-./geoip}:/geoip:ro
    # No published ports: only the frontend nginx talks to the backend,
    # over the internal Docker network (http://backend:8000).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Public by design (goes into the browser JS) — restrict it to your domain in CARTO
        VITE_CARTO_KEY: ${CARTO_API_KEY:-}
    container_name: ssh-rain-frontend
    restart: unless-stopped
    # Hardening: nginx-unprivileged (uid 101), no capabilities, read-only FS
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]   # nginx-unprivileged keeps pid + cache in /tmp
    mem_limit: 64m
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Docker bypasses ufw: bind to localhost by default.
      # A reverse proxy / Cloudflare Tunnel publishes it (BIND_ADDR=0.0.0.0 to expose directly).
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-8082}:3000"
    # 127.0.0.1 y no localhost: en Alpine localhost → ::1 y nginx solo escucha IPv4.
    # Pide "/" (estático), no /api: si cae el backend, el frontend no debe salir unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy   # no arranca hasta que el backend responde /api/health

volumes:
  siege-data:
