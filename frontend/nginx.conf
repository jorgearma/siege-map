# Zonas de límite (van fuera de server: este archivo se incluye dentro de http {})
limit_req_zone  $binary_remote_addr zone=api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ws:10m;

server {
    # 3000 y no 80: nginx corre sin root (uid 101) y no puede abrir puertos < 1024
    listen      3000;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # IP real del visitante (Cloudflare → túnel → gateway de Docker 172.x)
    # Imprescindible para el rate limit: sin esto todos los visitantes son "una IP"
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   CF-Connecting-IP;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (HSTS lo pone Cloudflare)
    add_header X-Frame-Options              "DENY" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # CSP en modo prueba: revisar la consola del navegador y luego pasar a Content-Security-Policy
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://unpkg.com https://*.basemaps.cartocdn.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Contacto para quien encuentre una vulnerabilidad (RFC 9116)
    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        return 200 "Contact: mailto:jorgesiemprearmando@gmail.com\nExpires: 2027-11-01T00:00:00Z\nPreferred-Languages: es, en\n";
    }

    # API: ^~ para que las regex de abajo (.zip, .log…) no la intercepten
    location ^~ /api/ {
        limit_req        zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # ya es la IP real (real_ip)
        proxy_set_header X-Forwarded-Proto https;           # Cloudflare siempre sirve HTTPS
    }

    # WebSocket: máximo 5 conexiones por IP (cada una es una cola en memoria del backend)
    location ^~ /ws {
        limit_conn        ws 5;
        limit_conn_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # Archivos ocultos (.git, .env…), extensiones sensibles y ruido de bots → 404 real
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(env|ini|log|bak|sql|tar|gz|zip|old|swp)$ { return 404; }
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|adminer) { return 404; }

    # Assets de Vite (nombre con hash) → caché 1 año. Solo "expires", NUNCA add_header aquí
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html sin caché: tras un deploy carga los JS nuevos al momento
    location = /index.html {
        expires -1;
    }

    # Sin router en React → 404 real (sin soft 404)
    location / {
        try_files $uri $uri/ =404;
    }
}
