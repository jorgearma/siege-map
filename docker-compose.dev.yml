services:
  backend:
    build: ./backend
    container_name: ssh-rain-backend
    restart: unless-stopped
    environment:
      - SSH_LOG_PATH=/logs/auth.log
      # scripts/fake_nginx_log.py --output ./logs/access.log
      - NGINX_LOG_PATHS=/logs/access.log
      - VPS_LAT=${VPS_LAT:-40.4168}
      - VPS_LON=${VPS_LON:-3.7038}
      - VPS_LABEL=${VPS_LABEL:-My VPS}
      - GEO_PROVIDER=${GEO_PROVIDER:-ip-api}
      - MAX_EVENTS=${MAX_EVENTS:-10000}
      - GEO_CACHE_TTL=${GEO_CACHE_TTL:-86400}
      - WS_BROADCAST_INTERVAL=${WS_BROADCAST_INTERVAL:-1.0}
      - TZ=${TZ:-UTC}
      - ALERT_INTERVAL=${ALERT_INTERVAL:-10}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    # Hardening: non-root user (Dockerfile) + only what it needs to read logs
    user: "10001"
    group_add:
      - "${LOG_GID:-4}"   # host "adm" group → read auth.log (root/syslog:adm 640) without root
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./logs:/logs:ro
      - siege-data-dev:/data
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Public by design (goes into the browser JS) — restrict it to your domain in CARTO
        VITE_CARTO_KEY: ${CARTO_API_KEY:-}
    container_name: ssh-rain-frontend
    restart: unless-stopped
    # Hardening: nginx-unprivileged (uid 101), no capabilities, read-only FS
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]   # nginx-unprivileged keeps pid + cache in /tmp
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  siege-data-dev:
